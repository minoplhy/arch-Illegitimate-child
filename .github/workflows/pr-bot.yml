name: PR Merge Bot

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  lgtm-merge:
    name: LGTM Fast-Forward Rebase Merge
    if: >
      github.event.issue.pull_request != null &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (
        trim(github.event.comment.body) == 'LGTM' ||
        trim(github.event.comment.body) == 'lgtm' ||
        startsWith(trim(github.event.comment.body), '/merge')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge Command
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Bot Credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Execute Linear Rebase Push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Fetch PR details
          PR_DATA=$(gh pr view "$PR_NUMBER" --json baseRefName,headRefName,state)
          BASE_BRANCH=$(echo "$PR_DATA" | jq -r '.baseRefName')
          HEAD_BRANCH=$(echo "$PR_DATA" | jq -r '.headRefName')
          STATE=$(echo "$PR_DATA" | jq -r '.state')

          if [ "$STATE" != "OPEN" ]; then
            echo "PR #$PR_NUMBER is not open ($STATE). Skipping."
            exit 0
          fi

          echo "Rebase-merging $HEAD_BRANCH into $BASE_BRANCH..."

          # Fetch branches
          git fetch origin "$BASE_BRANCH:$BASE_BRANCH"
          git fetch origin "$HEAD_BRANCH:$HEAD_BRANCH"

          # Advance base branch to rebased upgrade head
          if ! git push origin "$HEAD_BRANCH:$BASE_BRANCH" --force-with-lease; then
            gh pr comment "$PR_NUMBER" --body "⚠️ Failed to advance \`$BASE_BRANCH\` to \`$HEAD_BRANCH\`. The base branch may have drifted."
            exit 1
          fi

          # Close PR and delete temporary branch
          gh pr close "$PR_NUMBER" --comment "Merged via LGTM bot (clean linear rebase) 🚀"
          git push origin --delete "$HEAD_BRANCH" 2>/dev/null || true
